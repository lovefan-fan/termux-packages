name: Build custom bootstrap (com.yaohuo)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/custom_bootstrap.yml'
      - 'scripts/**'
      - 'packages/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch package name to com.yaohuo
        run: |
          sed -i 's|^TERMUX_APP__PACKAGE_NAME="com.termux"|TERMUX_APP__PACKAGE_NAME="com.yaohuo"|' scripts/properties.sh
          grep -n 'TERMUX_APP__PACKAGE_NAME="com' scripts/properties.sh

      - name: Setup Android SDK on runner
        run: |
          SDK="$GITHUB_WORKSPACE/build-tools/android-sdk"
          mkdir -p "$SDK"
          curl -sL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mkdir -p "$SDK/cmdline-tools"
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          export JAVA_HOME=$JAVA_HOME_17_X64
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-33" "platforms;android-35" "platforms;android-28" "platforms;android-24" "build-tools;30.0.3" "build-tools;37.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Pull builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Build bootstrap for aarch64
        run: |
          ./scripts/run-docker.sh bash -lc 'export TERMUX_APP_PACKAGE=com.yaohuo; export TERMUX_BASE_DIR=/data/data/com.yaohuo/files; export ANDROID_HOME=/home/builder/termux-packages/build-tools/android-sdk; export NDK=$(ls -d /home/builder/lib/android-ndk* | head -n1); export HOME=/home/builder; cd /home/builder/termux-packages && mkdir -p output && ./scripts/build-bootstraps.sh --architectures aarch64; ls -lh /home/builder/termux-packages/output/ | head -20'

      - name: Build apt repository from built debs
        run: |
          ./scripts/run-docker.sh bash -lc 'export HOME=/home/builder; sudo apt-get install -y -qq dpkg-dev >/dev/null 2>&1 || true; cd /home/builder/termux-packages/output && dpkg-scanpackages -m . /dev/null > Packages 2>/dev/null; gzip -kf Packages; mkdir -p dists/stable/main/binary-aarch64; cp Packages Packages.gz dists/stable/main/binary-aarch64/; echo "=== repo files ==="; ls -lh dists/stable/main/binary-aarch64/; echo "deb count: $(ls *.deb | wc -l)"'

      - name: Deploy apt repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true

      - name: Show artifacts
        run: ls -lh output/bootstrap-*.zip

      - name: Upload bootstrap zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64-com-yaohuo
          path: output/bootstrap-*.zip
          retention-days: 30
