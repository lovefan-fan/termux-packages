name: Build custom bootstrap (com.yaohuo)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/custom_bootstrap.yml'
      - 'scripts/**'
      - 'packages/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch package name to com.yaohuo
        run: |
          sed -i 's|^TERMUX_APP__PACKAGE_NAME="com.termux"|TERMUX_APP__PACKAGE_NAME="com.yaohuo"|' scripts/properties.sh
          grep -n 'TERMUX_APP__PACKAGE_NAME="com' scripts/properties.sh

      - name: Pull builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Pre-install SDK components for termux-am
        run: |
          ./scripts/run-docker.sh bash -lc 'export ANDROID_HOME=$(ls -d /home/builder/lib/android-sdk* | head -n1); echo "ANDROID_HOME=$ANDROID_HOME"; df -h /home/builder | tail -1; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;30.0.3"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"'

      - name: Build bootstrap for aarch64
        run: |
          ./scripts/run-docker.sh bash -lc 'export ANDROID_HOME=$(ls -d /home/builder/lib/android-sdk* | head -n1); export NDK=$(ls -d /home/builder/lib/android-ndk* | head -n1); export HOME=/home/builder; echo "ANDROID_HOME=$ANDROID_HOME NDK=$NDK"; cd /home/builder/termux-packages && ./scripts/build-bootstraps.sh --architectures aarch64'

      - name: Show artifacts
        run: ls -lh bootstrap-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64-com-yaohuo
          path: bootstrap-*.zip
          retention-days: 30
