name: Build custom bootstrap (com.yaohuo)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/custom_bootstrap.yml'
      - 'scripts/**'
      - 'packages/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch package name to com.yaohuo
        run: |
          sed -i 's|^TERMUX_APP__PACKAGE_NAME="com.termux"|TERMUX_APP__PACKAGE_NAME="com.yaohuo"|' scripts/properties.sh
          grep -n 'TERMUX_APP__PACKAGE_NAME="com' scripts/properties.sh

      - name: Setup Android SDK on runner
        run: |
          SDK="$GITHUB_WORKSPACE/build-tools/android-sdk"
          mkdir -p "$SDK"
          curl -sL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mkdir -p "$SDK/cmdline-tools"
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          export JAVA_HOME=$JAVA_HOME_17_X64
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-33" "platforms;android-35" "platforms;android-28" "platforms;android-24" "build-tools;30.0.3" "build-tools;37.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Pull builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Build bootstrap for aarch64
        run: |
          ./scripts/run-docker.sh bash -lc 'export ANDROID_HOME=/home/builder/termux-packages/build-tools/android-sdk; export NDK=$(ls -d /home/builder/lib/android-ndk* | head -n1); export HOME=/home/builder; cd /home/builder/termux-packages && mkdir -p output && ./scripts/build-bootstraps.sh --architectures aarch64; ls -lh /home/builder/termux-packages/output/'

      - name: Show artifacts
        run: ls -lh output/bootstrap-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64-com-yaohuo
          path: output/bootstrap-*.zip
          retention-days: 30
